\* TLC config for ApprovalStateMachine.
\* RFC-CIT-AGENT-0001 §5 / §9.1 row 1.
\*
\* Bounded model: 3 actions, 2 capsules, 5 roles, 4 tiers. Each action
\* may transition through O(|Roles|) awaiting states; the Quorum
\* function fixes the required multisets. State space is in the
\* ~10-50k range with symmetry on Actions and Capsules.

SPECIFICATION Spec

CONSTANTS
    Actions = {a1, a2, a3}
    Capsules = {cap1, cap2}
    Roles = {"Op", "Rv", "Co", "So", "Au"}
    Tiers = {"Low", "Medium", "High", "Critical"}
    \* Quorum mapping (RFC §5.2) is defined as an operator in the
    \* spec — TLC cfgs cannot accept function-valued record literals.

INVARIANTS
    TypeInvariant
    NoExecuteWithoutQuorum
    AuditorNeverApproves
    NoSilentPromotion
    DeterministicResume

PROPERTIES
    TerminalsAreSticky
    EventuallyTerminal

\* Symmetry over interchangeable actions and capsules. Roles + Tiers
\* are NOT symmetric (they have semantic ordering). The Symmetry
\* operator is defined in the spec file (TLC requires a single name).
SYMMETRY Symmetry

\* Bound the number of edits per run to avoid infinite EditTier loops.
\* The `edited` set is sticky, so once a Medium action is edited it
\* stays in `edited`; we don't bound the count explicitly because the
\* model has only 3 actions and a finite tier set, but we constrain
\* the state size below.
CONSTRAINT
    StateConstraint
