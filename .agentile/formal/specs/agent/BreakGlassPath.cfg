\* TLC config for BreakGlass.
\* RFC-CIT-AGENT-0001 §5.5 / §9.1 row 5.
\*
\* Bounded model: 2 actions, 4 approver roles, deadline = 3 ticks.
\* The clock is constrained to <= 5 to bound the state space. State
\* space ~5-20k with Actions symmetry.
\*
\* Note: AffirmationSet hardcodes {Rv, Co} per RFC §5.5; the Approvers
\* set MUST include both for the model to admit Affirmed transitions.

SPECIFICATION Spec

CONSTANTS
    Actions = {a1, a2}
    Approvers = {"Op", "Rv", "Co", "So"}
    DEADLINE = 3

INVARIANTS
    TypeInvariant
    BreakGlassNotifiesAll
    ITARBlocksBreakGlass
    OnlyEligibleInvokes
    AffirmedRequiresQuorum
    SurfacedWasInvoked

PROPERTIES
    SurfacedIsSticky
    AffirmedIsSticky
    WindowAlwaysResolves
    AffirmationOrSurfaced

\* Actions are interchangeable. Approver roles are NOT (semantic).
\* Symmetry operator defined in the spec (TLC requires a single name).
SYMMETRY Symmetry

\* Bound clock so TLC terminates. Clock advancing past DEADLINE + 2 ticks
\* lets every window expire; further ticks add no states.
CONSTRAINT
    StateConstraint
