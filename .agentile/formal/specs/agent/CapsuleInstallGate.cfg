\* TLC config for CapsuleInstall.
\* RFC-CIT-AGENT-0001 §4.5 / §9.1 row 4.
\*
\* Bounded model: 3 capsules, 3 signing tiers. State space ~5-15k after
\* symmetry on Capsules (Tiers are NOT symmetric since trust levels
\* differ).

SPECIFICATION Spec

CONSTANTS
    Capsules = {c1, c2, c3}
    Tiers = {"bundled", "managed", "workspace"}

INVARIANTS
    TypeInvariant
    NoCallableUninstalled
    NoPartialInstall
    SignatureBeforeWit
    WitBeforeApproval

PROPERTIES
    RejectedNeverInstalls
    InstalledIsSticky
    EveryProposedSettles

\* Capsules are interchangeable for safety checking.
\* Symmetry operator defined in the spec (TLC requires a single name).
SYMMETRY Symmetry
