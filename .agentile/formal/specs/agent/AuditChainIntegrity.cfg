\* TLC config for AuditChainIntegrity.
\* RFC-CIT-AGENT-0001 §6 / §9.1 row 2.
\*
\* Bounded model: 3 payloads, 3 signers, max chain length 4. The
\* abstract hash codomain is Nat; we cap reachable states by MaxLen.
\* State space ~5-20k after symmetry on Payloads and Signers.

SPECIFICATION Spec

CONSTANTS
    Payloads = {p1, p2, p3}
    Signers = {"s_op", "s_rv", "s_co"}
    MaxLen = 4
    GenesisHash = 0

INVARIANTS
    TypeInvariant
    SequenceContiguity
    ChainContiguity
    SignatureValidity
    NoDanglingPrevHash
    RecordsAreSigned

PROPERTIES
    AppendOnly
    EventuallyGrows

\* Payloads and signers are interchangeable for safety checking.
\* Symmetry operator defined in the spec (TLC requires a single name).
SYMMETRY Symmetry

\* nextHash grows unboundedly in principle. Bound it explicitly so TLC
\* terminates; MaxLen + 1 is sufficient since each AppendRecord
\* allocates exactly one fresh hash.
CONSTRAINT
    StateConstraint
