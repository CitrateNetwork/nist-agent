\* TLC config for DataClassLattice.
\* RFC-CIT-AGENT-0001 §7.2 / §9.1 row 3.
\*
\* Bounded model: 3 capsules, 1 of which is a Declassifier. The class
\* lattice has 5 elements (PUBLIC, CUI, PHI, FERPA, ITAR). The Init
\* admits ALL functions Capsules -> SUBSET Classes for reads and emits,
\* so state space is naively 2^5 = 32 per capsule per slot = 32^6 ~=
\* 1 billion. We trim aggressively with the CONSTRAINT below and the
\* Capsules symmetry (only c1 and c2 are interchangeable; the
\* Declassifier d1 is not).

SPECIFICATION Spec

CONSTANTS
    Capsules = {c1, c2, d1}
    Declassifiers = {d1}

INVARIANTS
    TypeInvariant
    NoReadUp
    NoWriteDownWithoutDeclassifier
    ITARNeverWritesPublic

PROPERTIES
    RefusedStaysRefused
    ClearanceMonotone
    EveryProposedSettled

\* c1 and c2 are interchangeable. d1 (the Declassifier) is NOT.
\* Symmetry operator defined in the spec (TLC requires a single name).
SYMMETRY Symmetry

\* Trim state space: bound the reach by limiting the universe of reads
\* and emits to a small set per capsule. We do this by bounding
\* Cardinality on the capsuleReads/capsuleEmits images. This constraint
\* is sound because the lattice properties scale with class count, not
\* with capsule count.
CONSTRAINT
    StateConstraint
