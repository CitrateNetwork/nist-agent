[package]
name = "nist-agent-release"
publish = false  # internal workspace crate; never published to crates.io
description = "Release manifest, detached-signature verification, installer flow, GGUF SI-7 hash check, and daemon-hash doctor check per RFC §§3.3, 8.2, 11.1. Consumes signed release bundles produced by the (deferred) CI workflow per ADR-011."
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
nist-agent-prelude = { path = "../nist-agent-prelude" }
serde = { workspace = true }
serde_json = { workspace = true }
toml = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
sha2 = { workspace = true }
hex = { workspace = true }
ed25519-dalek = { workspace = true }
# Single source of truth for the egress-posture mapping
# (NIST_AGENT-2026-05-31-009): the policy bundle's 3-state
# posture is authoritative; this crate's 2-state runtime gate
# derives from it via an exhaustive, test-pinned From impl.
nist-agent-policy = { path = "../nist-agent-policy" }
