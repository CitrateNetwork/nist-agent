[package]
name = "nist-agent-model"
description = "Model resolver for nist-agent — Model trait, Ollama HTTP client, llama.cpp server client, ResolvedModel resolution order per RFC-CIT-AGENT-0001 §3.3 + §8.2. SHA-256 hash verification per NIST SI-7."
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
async-trait = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
sha2 = { workspace = true }
hex = { workspace = true }
reqwest = { workspace = true }
url = { workspace = true }
futures = { workspace = true }
tokio = { workspace = true }
tokio-stream = { workspace = true }

# `feat-model-llamacpp` wires the embedded llama.cpp inference
# backend (resolver step 3, RFC §3.3). Gated because the dep
# pulls in a C++ build (cmake + clang) which makes air-gap
# builds heavier; operators who don't need on-prem inference
# build without the feature and keep the dep tree light.
#
# The SI-7 hash check on the GGUF runs unconditionally; only the
# inference path is feature-flagged.
llama-cpp-2 = { version = "0.1", optional = true }

[features]
default = []
feat-model-llamacpp = ["dep:llama-cpp-2"]

[dev-dependencies]
tempfile = "3.10"
