# Mirrored from citrate-agent-runtime/deny.toml (rev
# 2591ed2d28780ca7938befe853be7cd1620029cc). Keep in sync per
# planset/2026-05-19-nist-sidecar-v1/ALIGNMENT.md: this repo
# inherits runtime's supply-chain posture by construction.
#
# Rule of thumb: the `licenses.allow` list is the smallest set that
# permits the current dependency graph. Adding a new license requires
# a PR that updates this file — which forces reviewers to confirm the
# license is acceptable for downstream redistribution.

[licenses]
confidence-threshold = 0.8
# Stale-allowance warnings are informational; new sprints add deps
# whose licenses may already be in `allow`. Without this, cargo-deny
# treats unused-allowance as a failure on every PR that drops a dep.
unused-allowed-license = "allow"

allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "MIT",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-DFS-2016",
    "Unicode-3.0",
    "Zlib",
    "MPL-2.0",
    "CC0-1.0",
    "OpenSSL",
    # NCSA — pulled in by libfuzzer-sys (transitive via the
    # wasmtime fuzz harness in citrate-agent-core). Permissive,
    # University-of-Illinois flavour of BSD; redistribution-safe.
    "NCSA",
    # CDLA-Permissive-2.0 — pulled in by webpki-roots. Community
    # Data License Agreement, permissive variant; safe for our
    # distribution shape.
    "CDLA-Permissive-2.0",
    # Slint's royalty-free-for-end-user-app distribution license.
    # Our `feat-ui` Slint surface is consumed by the operator
    # who runs nist-agent locally; royalty-free 2.0 permits this
    # use without commercial licensing. The GPL-3.0 variant in
    # the same `OR` clause is rejected via cargo-deny's
    # confidence-threshold = 0.8 + the explicit allow here.
    "LicenseRef-Slint-Royalty-free-2.0",
    "LicenseRef-Slint-Software-3.0",
]

# Our own workspace crates are BUSL-1.1 (open-core tier, commit
# c245fef) and every one is `publish = false`. `private.ignore` skips
# license checks for those unpublished first-party crates only; it does
# NOT add BUSL-1.1 to `allow`, so a third-party BUSL dependency is
# still rejected.
[licenses.private]
ignore = true

[[licenses.exceptions]]
allow = ["OpenSSL"]
name = "ring"

[[licenses.clarify]]
name = "ring"
expression = "MIT AND ISC AND OpenSSL"
license-files = [
    { path = "LICENSE", hash = 0xbd0eed23 },
]

[[licenses.clarify]]
name = "encoding_rs"
expression = "(Apache-2.0 OR MIT) AND BSD-3-Clause"
license-files = [
    { path = "COPYRIGHT", hash = 0x39f8ad31 },
]

[advisories]
# cargo-deny ≥ 0.16 schema (per
# https://github.com/EmbarkStudios/cargo-deny/pull/611). Runtime's
# deny.toml still uses the 0.14 schema ("yanked = deny",
# "unmaintained = deny", "notice = deny") because its CI pulls an
# older cargo-deny version. In the new schema:
#   - `unmaintained`, `unsound`, `notice`, `vulnerability` were all
#     REMOVED. The strict-by-default behavior (deny all advisories)
#     is now built in.
#   - `yanked = "deny"` still accepted.
#   - `ignore = []` still accepted; populate with RUSTSEC-XXXX-XXXX
#     entries plus a one-line rationale to allow specific advisories.
yanked = "deny"
# Triage register for RUSTSEC advisories inherited via
# citrate-agent-core's transitive deps. Last reconciled 2026-09-23
# against a live `cargo deny check` (wasmtime now resolves to 45.0.2,
# not the 26.x this file was first written for). Everything fixable by
# a TARGETED, semver-compatible bump has been applied directly to
# Cargo.lock — anyhow 1.0.103, crossbeam-epoch 0.9.20, h2 0.4.16,
# ruint 1.20.0, rustls 0.23.45, wasmtime-wasi 45.0.2 (cleared the
# fd_renumber leak RUSTSEC-2026-0182), plus yanked-crate replacements
# chacha20 0.10.2 and spin 0.9.9. What remains here cannot be fixed at
# this repo's lockfile and is gated on an upstream change:
#
#   wasmtime core (3): RESOLVED 2026-09-24 — the citrate-agent-core
#     re-pin (0db3da6) moved wasmtime/wasmtime-wasi to 46.0.3, which
#     fixes RUSTSEC-2026-0222/-0269/-0188; their ignores were removed
#     once cargo-deny reported them as not encountered.
#
#   unmaintained (6): transitive stale crates with no safe upgrade —
#     rustybuzz/ttf-parser (Slint text/render, build-time only),
#     derivative/paste/rand_os/bincode (runtime transitive). Each needs
#     an upstream refactor or a Slint bump that drops them.
#
#   ANSI-escape logging (1): via a transitive log dep; remediated with
#     the structured-logging migration in S-13 prep.
#
# Every entry has a one-line reason linking the upstream gate.
# These ignores MUST be empty before the v1.0.0 tag.
ignore = [
    # ── ANSI-escape logger advisory ───────────────────────────
    { id = "RUSTSEC-2025-0055", reason = "ANSI escape logging vulnerability via transitive log dep; remediation tracked in S-13 prep alongside structured-logging migration" },
    # ── unmaintained transitive crates (no safe upgrade available) ──
    { id = "RUSTSEC-2026-0206", reason = "rustybuzz unmaintained (via Slint text/render stack, build/render-time only); no safe upgrade — track a Slint bump that moves to harfrust — S-13" },
    { id = "RUSTSEC-2026-0192", reason = "ttf-parser unmaintained (via Slint font parsing, build/render-time only); no safe upgrade — track a Slint bump that moves to skrifa — S-13" },
    { id = "RUSTSEC-2024-0388", reason = "derivative crate unmaintained (via runtime transitive); replace via upstream PR — S-13" },
    { id = "RUSTSEC-2024-0436", reason = "paste crate unmaintained (via runtime transitive); replace via upstream PR — S-13" },
    { id = "RUSTSEC-2025-0124", reason = "rand_os crate unmaintained (via runtime transitive); replace via upstream PR — S-13" },
    { id = "RUSTSEC-2025-0141", reason = "bincode unmaintained (via runtime workspace dep); runtime BACKLOG #124-adjacent migration — S-13" },
]

[bans]
multiple-versions = "warn"
wildcards = "deny"
# Internal workspace crates depend on their siblings with `version = "*"`,
# which is normal for a workspace and not a supply-chain risk. cargo-deny
# exempts wildcard *path* deps of unpublished crates when this is set (and
# every internal nist-agent-* crate is marked `publish = false`).
allow-wildcard-paths = true
highlight = "all"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
# Federation deps are fetched over https (the repos are public; see
# commit 63585a9, which moved Cargo.toml off the old SSH aliases).
# Adding a new git source requires a PR that justifies it.
allow-git = [
    "https://github.com/CitrateNetwork/citrate-agent-runtime",
    "https://github.com/CitrateNetwork/citrate-chain",
]
