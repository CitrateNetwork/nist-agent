[workspace]
# nist-agent — composable, NIST-compliant agent harness. Sidecar
# distribution of citrate-agent-core per RFC-CIT-AGENT-0001. Sidecar
# consumer (not fork) of citrate-agent-runtime; see
# .agentile/planset/2026-05-19-nist-sidecar-v1/ALIGNMENT.md for the
# ownership crosswalk.
members = [
    "crates/nist-agent-prelude",
    "crates/nist-agent-chain",
    "crates/nist-agent-model",
    "crates/nist-agent-loop",
    "crates/nist-agent-policy",
    "crates/nist-agent-doctor",
    "crates/nist-agent-overlays",
    "crates/nist-agent-audit-sinks",
    "crates/nist-agent-wizard",
    "crates/nist-agent-hitl",
    "crates/nist-agent-marketplace",
    "crates/nist-agent-mobile-pairing",
    "crates/nist-agent-release",
    "crates/nist-agent-cli",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["Citrate Network Inc.", "Mozi Satori LLP (custodian)"]
license = "Apache-2.0"
repository = "https://github.com/CitrateNetwork/nist-agent"
rust-version = "1.78"

[workspace.dependencies]
# Upstream agent engine. The rev MUST equal manifest's
# [repos.citrate-agent-runtime].rev in citrate-federation.
# Drift-check enforces this via the [[drift]] entry landed at
# citrate-federation commit 5759beb.
#
# When the federation bumps this rev (via pin-bump.sh), this line
# is the single edit point.
citrate-agent-core = { version = "0.4", git = "ssh://git@github-citrate-agent-runtime/CitrateNetwork/citrate-agent-runtime", rev = "2591ed2d28780ca7938befe853be7cd1620029cc" }

# Chain primitives from citrate-chain. Rev MUST match the federation
# manifest's [repos.citrate-chain].rev (currently
# 0f2d16b486a9ec1ed8a0394440dac480075d6942). Drift-check enforces
# this via the [[drift]] entry landed in citrate-federation commit
# 5759beb.
citrate-wallet-core = { version = "0.4", git = "ssh://git@github-citrate-chain/CitrateNetwork/citrate-chain", rev = "0f2d16b486a9ec1ed8a0394440dac480075d6942" }

# Standard deps mirrored from citrate-agent-runtime so version
# resolution stays stable. Add to this block instead of crate-local
# deps when the dep is shared.
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.40", features = ["full"] }
tracing = "0.1"
anyhow = "1.0"
thiserror = "2.0"
async-trait = "0.1"
k256 = { version = "0.13", features = ["ecdsa"] }
sha3 = "0.10"
sha2 = "0.10"  # SHA-256 for NIST SI-7 model file integrity verification
hex = "0.4"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
futures = "0.3"
tokio-stream = "0.1"
url = "2.5"
ciborium = "0.2"  # canonical CBOR for PolicyBundle (RFC 8949 §4.2.1)
ed25519-dalek = { version = "2.1", features = ["std"] }  # SecurityOfficer signature verification on bundles
toml = "0.8"  # release.manifest.toml decode (S-12 dist-bundled-gemma4 / dist-signed-releases scenarios)
clap = { version = "4.5", features = ["derive", "env"] }  # nist-agent-cli — S-12b operator bin
