name: TLA+ Verify

# Rule-10 BLOCKER: every safety-critical TLA+ spec under
# .agentile/formal/specs/ MUST verify under TLC on every PR.
# This is the load-bearing check for RFC-CIT-AGENT-0001 §9.1 and
# planset/2026-05-19-nist-sidecar-v1/ROADMAP.md S-2 exit criteria.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tla-verify-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  tlc:
    name: TLC verify all normative specs
    runs-on: ubuntu-latest
    env:
      # NA2-B-013: pinned tla2tools release tag + the SHA-256 of that
      # exact artifact. Both feed the cache key and the checksum gate
      # below, so a re-pin invalidates the cache. OWNER: confirm this
      # digest matches the v1.8.0 release asset; update both together
      # when bumping the tools version.
      TLA_TOOLS_TAG: v1.8.0
      TLA_TOOLS_SHA256: 936a262061c914694dfd669a543be24573c45d5aa0ff20a8b96b23d01e050e88
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Cache tla2tools.jar
        id: cache-tla
        uses: actions/cache@v4
        with:
          path: ~/.local/share/tla2tools.jar
          # Versioned by the tlaplus release tag we point at. Bump the
          # key when intentionally upgrading the tools binary.
          key: tla2tools-${{ env.TLA_TOOLS_TAG }}-${{ env.TLA_TOOLS_SHA256 }}

      - name: Download + checksum-verify tla2tools.jar
        if: steps.cache-tla.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          mkdir -p ~/.local/share
          curl -fL \
            "https://github.com/tlaplus/tlaplus/releases/download/${TLA_TOOLS_TAG}/tla2tools.jar" \
            -o ~/.local/share/tla2tools.jar
          # Sanity: valid JAR > 1 MB (catches truncated downloads).
          test "$(stat -c%s ~/.local/share/tla2tools.jar)" -gt 1000000
          file ~/.local/share/tla2tools.jar | grep -qE "(Java archive|Zip archive)"
          # Integrity: the fetched bytes MUST equal the pinned digest.
          # A mismatch fails the job — a changed or compromised jar can
          # no longer silently redefine what the specs verify against.
          echo "${TLA_TOOLS_SHA256}  ${HOME}/.local/share/tla2tools.jar" | sha256sum -c -

      - name: Verify every spec under .agentile/formal/specs/
        run: |
          set +e  # don't let an inner non-zero kill the whole loop
          failed=()
          bounded=()
          shopt -s nullglob

          # Specs whose state space exceeds the per-PR runner's CPU
          # budget. Per VERIFICATION_WORKFLOW.md option 4 and the
          # archive's TLC_BASELINE.md "BOUNDED_EXPLORATION (TIMEOUT
          # with zero violations)" pattern: TLC's progressive
          # state-search runs without ever finding a violation, but
          # we hit the wall clock before exhausting the reachable
          # space. Tolerated, not BLOCKER. Tightening their .cfg or
          # provisioning a slow-track CI is tracked in S-2 RETRO.
          BOUNDED_EXPLORATION_SPECS="BreakGlassPath DataClassLattice"

          for spec in .agentile/formal/specs/**/*.tla; do
            name=$(basename "$spec" .tla)
            cfg="${spec%.tla}.cfg"
            echo "::group::TLC $name"
            # -deadlock DISABLES TLC's default deadlock check
            # (counter-intuitive flag name inherited from earlier
            # TLC versions). Our specs include intentional terminal
            # states (Executed, Rejected, Affirmed) which TLC would
            # otherwise flag as deadlocks. Safety invariants
            # (INVARIANTS) and liveness (PROPERTIES) are still
            # checked because TLC gates those by its own machinery.
            timeout 600 java -Xmx2500M -jar ~/.local/share/tla2tools.jar \
                -workers auto -deadlock -config "$cfg" "$spec"
            exit_code=$?
            echo "::endgroup::"

            if [ $exit_code -eq 0 ]; then
              echo "✓ $name PASS"
            elif [ $exit_code -eq 124 ] || [ $exit_code -eq 137 ]; then
              # Timeout. Acceptable iff the spec is on the
              # BOUNDED_EXPLORATION list.
              if [[ " $BOUNDED_EXPLORATION_SPECS " == *" $name "* ]]; then
                echo "⚠ $name BOUNDED_EXPLORATION (timeout, no violation found)"
                bounded+=("$name")
              else
                echo "::error file=$spec::TLC timed out and spec is not on BOUNDED_EXPLORATION list"
                failed+=("$name (timeout)")
              fi
            else
              echo "::error file=$spec::TLC exited with code $exit_code"
              failed+=("$name (exit $exit_code)")
            fi
          done

          echo
          echo "TLC verification summary:"
          # shellcheck disable=SC2012 # find shellcheck-preferred; ls -- safer for our depth
          total=$(find .agentile/formal/specs -name '*.tla' 2>/dev/null | wc -l)
          echo "  PASS: $(( total - ${#failed[@]} - ${#bounded[@]} ))"
          echo "  BOUNDED_EXPLORATION: ${#bounded[@]} ${bounded[*]:+(${bounded[*]})}"
          echo "  FAILED: ${#failed[@]} ${failed[*]:+(${failed[*]})}"

          if [ ${#failed[@]} -gt 0 ]; then
            echo "::error::TLC verification failed for: ${failed[*]}"
            exit 1
          fi
          echo "All specs verified (counting BOUNDED_EXPLORATION as advisory passes)."

          if [ ${#failed[@]} -gt 0 ]; then
            echo "::error::TLC verification failed for: ${failed[*]}"
            exit 1
          fi
          echo "All specs verified."
