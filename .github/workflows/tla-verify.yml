name: TLA+ Verify

# Rule-10 BLOCKER: every safety-critical TLA+ spec under
# .agentile/formal/specs/ MUST verify under TLC on every PR.
# This is the load-bearing check for RFC-CIT-AGENT-0001 §9.1 and
# planset/2026-05-19-nist-sidecar-v1/ROADMAP.md S-2 exit criteria.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tla-verify-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  tlc:
    name: TLC verify all normative specs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Cache tla2tools.jar
        id: cache-tla
        uses: actions/cache@v4
        with:
          path: ~/.local/share/tla2tools.jar
          # Versioned by the tlaplus release tag we point at. Bump the
          # key when intentionally upgrading the tools binary.
          key: tla2tools-v1.8.0

      - name: Download tla2tools.jar
        if: steps.cache-tla.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/.local/share
          curl -fL \
            https://github.com/tlaplus/tlaplus/releases/latest/download/tla2tools.jar \
            -o ~/.local/share/tla2tools.jar
          # Sanity: file should be a valid JAR > 5 MB.
          test "$(stat -c%s ~/.local/share/tla2tools.jar)" -gt 5000000
          file ~/.local/share/tla2tools.jar | grep -qE "(Java archive|Zip archive)"

      - name: Verify every spec under .agentile/formal/specs/
        run: |
          set -e
          failed=()
          shopt -s nullglob
          # 10-minute per-spec budget; matches the archive's PR-time
          # budget. ApprovalStateMachine clocks ~60s, others under
          # 15s, so 10 minutes is generous slack.
          for spec in .agentile/formal/specs/**/*.tla; do
            name=$(basename "$spec" .tla)
            cfg="${spec%.tla}.cfg"
            echo "::group::TLC $name"
            if ! timeout 600 java -Xmx2500M -jar ~/.local/share/tla2tools.jar \
                -workers auto -config "$cfg" "$spec"; then
              echo "::error file=$spec::TLC verification failed"
              failed+=("$name")
            fi
            echo "::endgroup::"
          done

          if [ ${#failed[@]} -gt 0 ]; then
            echo "::error::TLC verification failed for: ${failed[*]}"
            exit 1
          fi
          echo "All specs verified."
