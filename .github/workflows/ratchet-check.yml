name: Ratchet Check

# The four ratchets (Rules 3, 10, tripwire-discipline, 12) running on
# every PR and push to main. Each ratchet reads its baseline from
# `.agentile/coverage/baseline.json`. If the baseline is missing or
# the relevant command is empty, that ratchet is a no-op (skeleton-
# friendly behavior — the project owner runs bootstrap.sh to fill in
# baselines).

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ratchet-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-ratchet:
    name: Test count ratchet (Rule 3)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # nist-agent's canonical test command is `cargo test --workspace`,
      # which requires the Rust toolchain plus deploy-key access to two
      # private federation repos (citrate-agent-runtime and citrate-chain).
      # The same SSH config + secrets used by .github/workflows/ci.yml.
      - name: Configure SSH deploy keys for federation deps
        env:
          AGENT_RUNTIME_DEPLOY_KEY: ${{ secrets.AGENT_RUNTIME_DEPLOY_KEY }}
          CHAIN_DEPLOY_KEY: ${{ secrets.CHAIN_DEPLOY_KEY }}
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          ssh-keyscan github.com >> ~/.ssh/known_hosts
          umask 077
          printf '%s\n' "$AGENT_RUNTIME_DEPLOY_KEY" > ~/.ssh/citrate-agent-runtime-readonly
          chmod 600 ~/.ssh/citrate-agent-runtime-readonly
          printf '%s\n' "$CHAIN_DEPLOY_KEY" > ~/.ssh/citrate-chain-readonly
          chmod 600 ~/.ssh/citrate-chain-readonly
          cat > ~/.ssh/config <<'SSHEOF'
          Host github-citrate-agent-runtime
              HostName github.com
              User git
              IdentityFile ~/.ssh/citrate-agent-runtime-readonly
              IdentitiesOnly yes
              StrictHostKeyChecking accept-new
          Host github-citrate-chain
              HostName github.com
              User git
              IdentityFile ~/.ssh/citrate-chain-readonly
              IdentitiesOnly yes
              StrictHostKeyChecking accept-new
          SSHEOF
          chmod 600 ~/.ssh/config

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y libclang-dev cmake libssl-dev pkg-config

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Test count ratchet
        run: ./scripts/ci/check_test_ratchet.py

  spec-ratchet:
    name: Formal spec count ratchet (Rule 10)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Spec count ratchet
        run: ./scripts/ci/check_spec_ratchet.py

  tripwire-ratchet:
    name: CI tripwire count ratchet
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Tripwire count ratchet
        run: ./scripts/ci/check_tripwire_ratchet.py

  frontmatter-ratchet:
    name: Frontmatter coverage ratchet (Rule 12)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Frontmatter coverage ratchet
        # No --files flag: this is the project-wide ratchet, distinct
        # from lint-frontmatter.yml which scopes to changed files.
        run: ./scripts/ci/check_frontmatter.py
